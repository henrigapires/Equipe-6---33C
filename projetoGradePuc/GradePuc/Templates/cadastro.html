{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - grade.puc</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'base.css' %}">
    <link rel="stylesheet" href="{% static 'autenticacao.css' %}">
</head>
<body class="auth-page">
<h1>Cadastre-se no Grade.puc</h1>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div>
        <label>Nome:</label>
        <input type="text" name="nome" required>
    </div>

    <div>
        <label>Matrícula:</label>
        <input type="text" name="matricula" required>
    </div>

    <div>
        <label>E-mail:</label>
        <input type="email" name="email">
    </div>

    <div>
        <label>Senha:</label>
        <input type="password" name="password" required>
    </div>

    <div>
        <label>Confirme sua senha:</label>
        <input type="password" name="confirmar_senha" required>
    </div>

    <div>
        <label for="espelho">Espelho do histórico (PDF do SAU, opcional):</label>
        <input type="file" name="espelho" id="espelho" accept=".pdf,application/pdf">
        <small>
            No SAU, abra o Espelho do Histórico e salve em PDF. Assim o grade.puc não sugere
            disciplinas que você já fez. Você também pode enviar depois, no seu perfil.
        </small>
    </div>

    <button type="submit">Cadastrar</button>

    <p class="auth-error">{{ error_msg }}</p>
</form>

<p>
    Já tem uma conta?
    <a href="{% url 'login' %}">Faça login</a>
</p>
</body>
</html>
